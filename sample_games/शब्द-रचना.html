<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="UTF-8">
<title>Sanskrit Word Builder</title>
<style>
    body { font-family: sans-serif; text-align: center; background: #fdf5e6; color: #333; }
    #board { display: grid; grid-template-columns: repeat(8, 50px); grid-gap: 2px; justify-content: center; margin: 20px auto; background: #8b4513; padding: 5px; width: max-content; }
    .cell { width: 50px; height: 50px; background: #fff8dc; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; }
    #rack { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px; padding: 20px; background: #e8d8c3; border-radius: 8px; }
    .tile { width: 40px; height: 40px; background: #ffdead; border: 2px solid #cd853f; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: grab; font-weight: bold; box-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
</style>
</head>
<body>

    <h2>संस्कृत-शब्द-रचना (Sanskrit Word Builder)</h2>
    <p>Drag Devanagari syllables and Vibhakti markers onto the board to form words.</p>

    <div id="board"></div>
    <div id="rack"></div>

    <script>
        const letters = ['रा', 'म', 'ग', 'ज', 'फ', 'ल', 'दे', 'व', 'हा', 'रि', 'ः', 'म्', 'स्य', 'ाय', 'ान्', 'ौ', 'े', 'न्'];
        
        function initGame() {
            const board = document.getElementById('board');
            for(let i=0; i<64; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.setAttribute('ondrop', 'drop(event)');
                cell.setAttribute('ondragover', 'allowDrop(event)');
                board.appendChild(cell);
            }

            const rack = document.getElementById('rack');
            letters.forEach((l, index) => {
                let tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = l;
                tile.draggable = true;
                tile.id = 'tile' + index;
                tile.setAttribute('ondragstart', 'drag(event)');
                rack.appendChild(tile);
            });
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            if(ev.target.className === 'cell' && ev.target.children.length === 0) {
                ev.target.appendChild(document.getElementById(data));
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
