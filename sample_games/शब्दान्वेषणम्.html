<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="UTF-8">
<title>Sanskrit Boggle</title>
<style>
    body { font-family: sans-serif; text-align: center; background: #e0f7fa; color: #004d40; }
    #boggle-grid { display: grid; grid-template-columns: repeat(4, 60px); grid-gap: 5px; justify-content: center; margin: 20px auto; }
    .dice { width: 60px; height: 60px; background: #ffffff; border: 2px solid #00796b; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #004d40; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00796b; color: white; border: none; border-radius: 5px; }
    button:hover { background: #004d40; }
    #word-list { margin-top: 20px; list-style: none; padding: 0; font-size: 18px; }
    input { padding: 10px; font-size: 16px; width: 200px; text-align: center; }
</style>
</head>
<body>

    <h2>शब्दान्वेषणम् (Boggle)</h2>
    <p>Find valid Sanskrit words in the grid below.</p>
    
    <div id="boggle-grid"></div>
    
    <button onclick="shuffleBoard()">Shuffle Board</button>
    <br><br>
    
    <input type="text" id="word-input" placeholder="Type a word...">
    <button onclick="addWord()">Add Word</button>

    <ul id="word-list"></ul>

    <script>
        const syllables = ['अ', 'आ', 'क', 'ग', 'च', 'ज', 'त', 'द', 'न', 'प', 'ब', 'म', 'य', 'र', 'ल', 'व', 'श', 'स', 'ह', 'ा', 'ि', 'ी', 'ु', 'ू', 'े', 'ो', 'ः', 'म्'];
        
        function shuffleBoard() {
            const grid = document.getElementById('boggle-grid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                let randomChar = syllables[Math.floor(Math.random() * syllables.length)];
                let dice = document.createElement('div');
                dice.className = 'dice';
                dice.innerText = randomChar;
                grid.appendChild(dice);
            }
        }

        function addWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim();
            if (word) {
                const list = document.getElementById('word-list');
                const li = document.createElement('li');
                li.innerText = "✓ " + word;
                list.appendChild(li);
                input.value = '';
            }
        }

        window.onload = shuffleBoard;
    </script>
</body>
</html>
