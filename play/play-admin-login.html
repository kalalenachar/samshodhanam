<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/static/js/mobile-android.js" defer></script>

    <link rel="stylesheet" href="/sdl/static/css/theme.css?v=35">
    <script>
        (function() {
            var t = localStorage.getItem('smsdl-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Admin — Login</title>
  <link rel="stylesheet" href="/quiz/style.css?v=100">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <nav class="navbar">
    <div class="navbar-brand-group">
      <a href="/" class="navbar-home-btn" title="Main Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
      <a href="/play/" class="navbar-brand"><img src="/static/images/game_admin.png" class="navbar-logo" alt="Games Admin Logo">क्रीडा <span class="highlight">प्रबन्धकः</span></a>
    </div>
    <div class="navbar-links">
      <a href="/play/">Play Games</a>
      <a href="play-admin-login.html" class="active">Admin</a>
    </div>
  </nav>

  <div class="container container-sm" style="padding-top: 4rem;">
    <div class="card">
      <div class="text-center mb-2">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🎮</div>
        <h1 style="font-size: 1.5rem;">Play Admin Login</h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Enter username" required autocomplete="off" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-input" placeholder="Enter password" required style="padding-right: 40px; width: 100%;">
            <button type="button" onclick="const p=document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password'; this.innerHTML = p.type === 'password' ? '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>' : '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>'" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted, #94a3b8); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
          Login
        </button>
      </form>
    </div>

    <div class="text-center mt-2">
      <a href="/" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">← Back to Home</a>
    </div>
  </div>

  <script>
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // Check if already authenticated or has an active session cookie on backend
    async function checkExistingSession() {
      if (sessionStorage.getItem('isPlayAdmin') === 'true') {
        window.location.href = 'play-admin.html';
        return;
      }
      try {
        const res = await fetch('/sdl/api/external/session-sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include'
        });
        const data = await res.json();
        if (data.logged_in && (data.user.role === 'admin' || data.user.role === 'super')) {
          sessionStorage.setItem('isPlayAdmin', 'true');
          sessionStorage.setItem('isAdmin', 'true');
          window.location.href = 'play-admin.html';
        }
      } catch (err) {
        console.error('Session sync check failed:', err);
      }
    }
    checkExistingSession();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      const API_BASE_URL = '/api/v1';

      try {
        const response = await fetch(`${API_BASE_URL}/quiz/admin-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username: user, password: pass })
        });

        const resData = await response.json();

        if (response.ok && resData.success) {
          sessionStorage.setItem('isPlayAdmin', 'true');
          // Support both legacy quiz admin role and new play admin permission
          sessionStorage.setItem('isAdmin', 'true');
          window.location.href = 'play-admin.html';
        } else {
          showToast(resData.error || 'Invalid credentials or access level', 'error');
          btn.disabled = false;
          btn.textContent = 'Login';
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Server connection failed. Try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>

    <script src="/sdl/static/js/theme.js?v=35"></script></body>
</html>
