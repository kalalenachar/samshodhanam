<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/static/js/mobile-android.js" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=35">
    <script>
        (function() {
            var t = localStorage.getItem('smsdl-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <script>
        (function() {
            const currentServerId = "{{ server_startup_id }}";
            if (currentServerId) {
                const savedServerId = sessionStorage.getItem('server_startup_id');
                if (savedServerId && savedServerId !== currentServerId) {
                    try {
                        const theme = localStorage.getItem('smsdl-theme');
                        sessionStorage.clear();
                        localStorage.clear();
                        if (theme) {
                            localStorage.setItem('smsdl-theme', theme);
                        }
                        const cookies = document.cookie.split(";");
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i];
                            const eqPos = cookie.indexOf("=");
                            const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;";
                        }
                    } catch (e) {}
                    window.location.reload();
                    return;
                }
                try {
                    sessionStorage.setItem('server_startup_id', currentServerId);
                } catch (e) {}
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Denied - Admin Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--t-bg-body-start);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--t-text-primary);
        }
        .container {
            text-align: center;
            background: var(--t-bg-surface);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--t-border);
            box-shadow: var(--t-shadow);
            max-width: 500px;
        }
        h1 {
            color: #dc3545;
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .perm-code {
            display: inline-block;
            background: var(--t-hover-bg);
            border: 1px solid var(--t-border-light);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            background-color: var(--t-accent);
            color: var(--t-text-on-accent);
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--t-accent-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <p>Access Denied</p>
        <p>You do not have the required permission to access this resource: <br><span class="perm-code">{{ permission or 'RESTRICTED' }}</span></p>
        <a href="/admin" class="btn">Back to Dashboard</a>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}?v=30"></script></body>
</html>
