<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/static/js/mobile-android.js" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=35">
    <script>
        (function() {
            var t = localStorage.getItem('smsdl-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <script>
        (function() {
            const currentServerId = "{{ server_startup_id }}";
            if (currentServerId) {
                const savedServerId = sessionStorage.getItem('server_startup_id');
                if (savedServerId && savedServerId !== currentServerId) {
                    try {
                        const theme = localStorage.getItem('smsdl-theme');
                        sessionStorage.clear();
                        localStorage.clear();
                        if (theme) {
                            localStorage.setItem('smsdl-theme', theme);
                        }
                        const cookies = document.cookie.split(";");
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i];
                            const eqPos = cookie.indexOf("=");
                            const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;";
                        }
                    } catch (e) {}
                    window.location.reload();
                    return;
                }
                try {
                    sessionStorage.setItem('server_startup_id', currentServerId);
                } catch (e) {}
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sanskrit Digital Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=37">
</head>

<body spellcheck="false">
    <header class="header admin-header">
        <h1><span class="emoji">🔐</span> <span>Admin</span> Login</h1>
        <nav>
            <a href="{{ url_for('search_page') }}">←</a>
        </nav>
    </header>

    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <div class="login-container">
        <h2><span class="emoji">🔑</span> Admin Login</h2>
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" required style="padding-right: 40px; width: 100%;">
                    <button type="button" onclick="const p=document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password'; this.innerHTML = p.type === 'password' ? '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\'></path><circle cx=\'12\' cy=\'12\' r=\'3\'></circle></svg>' : '<svg width=\'20\' height=\'20\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\'></path><line x1=\'1\' y1=\'1\' x2=\'23\' y2=\'23\'></line></svg>'" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--t-text-muted, #94a3b8); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/theme.js') }}?v=30"></script></body>

</html>
