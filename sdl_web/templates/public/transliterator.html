    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=35">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('smsdl-theme');
                if (!t) {
                    var match = document.cookie.match(new RegExp('(^| )smsdl-theme=([^;]+)'));
                    if (match) t = match[2];
                }
                t = t || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <script>
        (function() {
            const currentServerId = "{{ server_startup_id }}";
            if (currentServerId) {
                const savedServerId = sessionStorage.getItem('server_startup_id');
                if (savedServerId && savedServerId !== currentServerId) {
                    try {
                        const theme = localStorage.getItem('smsdl-theme');
                        sessionStorage.clear();
                        localStorage.clear();
                        if (theme) {
                            localStorage.setItem('smsdl-theme', theme);
                        }
                        const cookies = document.cookie.split(";");
                        for (let i = 0; i < cookies.length; i++) {
                            const cookie = cookies[i];
                            const eqPos = cookie.indexOf("=");
                            const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                            document.cookie = name.trim() + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;";
                        }
                    } catch (e) {}
                    window.location.reload();
                    return;
                }
                try {
                    sessionStorage.setItem('server_startup_id', currentServerId);
                } catch (e) {}
            }
        })();
    </script>

        }

        .script-group select {
            padding: 8px 14px;

            border: 2px solid #cbd5e0;
            font-size: 15px;
            font-weight: 600;

        .arrow-label {

            color: #667eea;
            font-weight: bold;
            padding-bottom: 4px;
        }

            font-size: 1.1em;
            font-weight: 600;
            color: var(--t-text-secondary);
        }

            display: grid;
            grid-template-columns: 1fr auto 1fr;

            align-items: center;

        }

            background: linear-gradient(45deg, #38b2ac, #319795);
            color: white;
            border: none;
            border-radius: 50%;

            height: 60px;
            font-size: 24px;

            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(56, 178, 172, 0.3);

            font-weight: 600;
            margin-bottom: 10px;
            color: var(--t-text-secondary);
            font-size: 1.1em;
        }

            font-size: 18px;

            color: var(--t-input-text) !important;

        .modal-overlay {

            .back-button::before {

        @media (max-width: 480px) {
            .mode-indicator {
                font-size: 0.9em;
            }

            .anusvara-toggle {

                gap: 10px;
                text-align: center;
            }
        }
        body.osk-active {
            padding-bottom: 240px !important;
        }
    </style>
</head>

    <script>
        async function checkBotStatus() {
            const dot = document.getElementById('botStatusDot');
            const text = document.getElementById('botStatusText');
            const pill = document.getElementById('botStatusPill');
            const btn = document.getElementById('btnHeaderTelegram');

            try {
                const res = await fetch('/api/transliterator/status');
                const data = await res.json();
                const uname = data.bot_username || 'TVSM_Translatorator_Bot';
                if (btn) btn.href = 'https://t.me/' + uname;

                if (data.running) {
                    if (dot) {
                        dot.className = 'status-dot online';
                        dot.style.background = '#22c55e';
                    }
                    if (text) text.textContent = `Telegram Bot Online (@${uname})`;
                    if (pill) pill.title = `Transliterator Telegram Bot is active (@${uname})`;
                } else {
                    if (dot) {
                        dot.className = 'status-dot';
                        dot.style.background = '#ef4444';
                    }
                    if (text) text.textContent = 'Telegram Bot Offline';
                    if (pill) pill.title = 'Transliterator Telegram Bot is offline';
                }
            } catch (e) {
                if (dot) dot.style.background = '#ef4444';
                if (text) text.textContent = 'Telegram Bot Offline';
            }
        }
        document.addEventListener('DOMContentLoaded', checkBotStatus);

        const SCRIPTS = ['sa', 'ka', 'te', 'ta', 'en'];
        let fullInputText = ''; // Stores full content of uploaded file
        let uploadedFileName = '';

        // [sa, ka, te, ta, en]
        // Tamil column uses:
        //   Native Tamil chars for vowels, nasals, semi-vowels, Grantha for ज श ष स ह
        //   Superscript numbers ² ³ ⁴ for aspirated/voiced variants within each varga
        //     ① base       = native Tamil char (e.g. க)
        //     ② aspirated  = base + ² (e.g. க²)
        //     ③ voiced     = base + ³ (e.g. க³)   [ca-varga uses ஜ for ja]
        //     ④ voiced asp = base + ⁴ (e.g. க⁴)  [ca-varga uses ஜ²]
        //     ⑤ nasal      = native Tamil nasal (ங ஞ ண ந ம)
        const PHONEME_TABLE = [

            ['३', '೩', '౩', '௩', '3'],
            ['४', '೪', '౪', '௪', '4'],
            ['५', '೫', '౫', '௫', '5'],
            ['६', '೬', '౬', '௬', '6'],

            ['८', '೮', '౮', '௮', '8'],

            ['ॆ', 'ೆ', 'ె', 'ெ', 'e'],
            ['ऒ', 'ಒ', 'ఒ', 'ஒ', 'o'],
            ['ॊ', 'ೊ', 'ొ', 'ொ', 'o'],

            ['ॐ', 'ಓಂ', 'ఓం', 'ஓம்', 'oṃ'],
            // Avagraha (79)

            // Danda & Double Danda (81-82)
            ['।', '।', '।', '।', '|'],
            ['॥', '॥', '॥', '॥', '||'],

        // Build lookup maps
        const charToIdx = SCRIPTS.map(() => ({}));
        const idxToChar = SCRIPTS.map(() => ({}));

        PHONEME_TABLE.forEach((row, rowIdx) => {
            SCRIPTS.forEach((_, sIdx) => {
                const ch = row[sIdx];
                if (ch !== undefined && ch !== null) {
                    if (ch.length > 0 && charToIdx[sIdx][ch] === undefined) {
                        charToIdx[sIdx][ch] = rowIdx;
                    }
                    if (idxToChar[sIdx][rowIdx] === undefined) {
                        idxToChar[sIdx][rowIdx] = ch;
                    }
                }
            });
        });

        // Aliases for alternate Unicode representations & Devanagari OCR/nukta variants
        if (charToIdx[3]['ௐ'] === undefined) charToIdx[3]['ௐ'] = charToIdx[0]['ॐ'];
        if (charToIdx[3]['\''] === undefined) charToIdx[3]['\''] = charToIdx[0]['ऽ'];
        if (charToIdx[3]['’'] === undefined) charToIdx[3]['’'] = charToIdx[0]['ऽ'];
        if (charToIdx[3]['‘'] === undefined) charToIdx[3]['‘'] = charToIdx[0]['ऽ'];
        if (charToIdx[4]['’'] === undefined) charToIdx[4]['’'] = charToIdx[0]['ऽ'];
        if (charToIdx[4]['‘'] === undefined) charToIdx[4]['‘'] = charToIdx[0]['ऽ'];
        if (charToIdx[4]['.'] === undefined) charToIdx[4]['.'] = charToIdx[0]['।'];

        if (charToIdx[0]['क़'] === undefined) charToIdx[0]['क़'] = charToIdx[0]['क'];
        if (charToIdx[0]['ख़'] === undefined) charToIdx[0]['ख़'] = charToIdx[0]['ख'];
        if (charToIdx[0]['ग़'] === undefined) charToIdx[0]['ग़'] = charToIdx[0]['ग'];
        if (charToIdx[0]['ज़'] === undefined) charToIdx[0]['ज़'] = charToIdx[0]['ज'];
        if (charToIdx[0]['ड़'] === undefined) charToIdx[0]['ड़'] = charToIdx[0]['ड'];
        if (charToIdx[0]['ढ़'] === undefined) charToIdx[0]['ढ़'] = charToIdx[0]['ढ'];
        if (charToIdx[0]['फ़'] === undefined) charToIdx[0]['फ़'] = charToIdx[0]['फ'];
        if (charToIdx[0]['य़'] === undefined) charToIdx[0]['य़'] = charToIdx[0]['य'];
        if (charToIdx[0]['ऩ'] === undefined) charToIdx[0]['ऩ'] = charToIdx[0]['न'];
        if (charToIdx[0]['ऱ'] === undefined) charToIdx[0]['ऱ'] = charToIdx[0]['र'];
        if (charToIdx[0]['ऴ'] === undefined) charToIdx[0]['ऴ'] = charToIdx[0]['ळ'];
        if (charToIdx[0]['ऄ'] === undefined) charToIdx[0]['ऄ'] = charToIdx[0]['अ'];
        if (charToIdx[0]['ऍ'] === undefined) charToIdx[0]['ऍ'] = charToIdx[0]['ए'];
        if (charToIdx[0]['ॅ'] === undefined) charToIdx[0]['ॅ'] = charToIdx[0]['े'];
        if (charToIdx[0]['ऑ'] === undefined) charToIdx[0]['ऑ'] = charToIdx[0]['ओ'];
        if (charToIdx[0]['ॉ'] === undefined) charToIdx[0]['ॉ'] = charToIdx[0]['ो'];
        if (charToIdx[0]['ॲ'] === undefined) charToIdx[0]['ॲ'] = charToIdx[0]['अ'];
        if (charToIdx[0]['ऀ'] === undefined) charToIdx[0]['ऀ'] = charToIdx[0]['ँ'];
        if (charToIdx[0]['ॎ'] === undefined) charToIdx[0]['ॎ'] = charToIdx[0]['े'];
        if (charToIdx[0]['ॏ'] === undefined) charToIdx[0]['ॏ'] = charToIdx[0]['ौ'];
        if (charToIdx[0]['॰'] === undefined) charToIdx[0]['॰'] = charToIdx[0]['।'];

        // Automatically build Tamil multi-char tokens from the table to ensure sync
        const tamilMultiTokens = [];
        PHONEME_TABLE.forEach(row => {
            const ch = row[3]; // Tamil index
            if (ch && ch.length > 1 && !tamilMultiTokens.includes(ch)) {
                tamilMultiTokens.push(ch);
            }
        });
        tamilMultiTokens.sort((a, b) => b.length - a.length);

        function getChar(sIdx, rIdx, fallback) {
            if (sIdx === -1 || rIdx === undefined) return fallback;
            const ch = idxToChar[sIdx][rIdx];
            return (ch !== undefined) ? ch : fallback;
        }

        // IAST multi-char sequences, longest first
        const iastSeq = ['oṃ', 'ā', 'ī', 'ū', 'ē', 'ō', 'ṛ', 'ṝ', 'ḷ', 'ḹ', 'ai', 'au', 'e', 'o', 'i', 'u', 'ṃ', 'ḥ', 'ṅ', 'ñ', 'ṭh', 'ḍh', 'ṭ', 'ḍ', 'ṇ', 'ś', 'ṣ', 'kh', 'gh', 'ch', 'jh', 'th', 'dh', 'ph', 'bh'];

        // Vedic accents regex: Udatta (\u0951), Anudatta (\u0952), Vedic Extensions (\u1CD0-\u1CF9), Devanagari Extended (\uA8E0-\uA8F1)
        const isVedicAccent = (code) => (code === 0x0951 || code === 0x0952 || (code >= 0x1CD0 && code <= 0x1CF9) || (code >= 0xA8E0 && code <= 0xA8F1));

        function convertScript(text, fromScriptName, toScriptName) {
            if (!text || fromScriptName === toScriptName) return text;
            if (typeof text.normalize === 'function') {
                text = text.normalize('NFD').replace(/\u093C/g, '').normalize('NFC');
            }
            const fromIdx = SCRIPTS.indexOf(fromScriptName);
            const toIdx = SCRIPTS.indexOf(toScriptName);
            if (fromIdx === -1 || toIdx === -1) return text;

            let result = '';
            let i = 0;

            // Helper for IAST row selection
            const findBestIastRow = (seq, lastWasConsonant) => {
                const matchingRows = [];
                PHONEME_TABLE.forEach((r, idx) => { if (r[4] === seq) matchingRows.push(idx); });
                if (matchingRows.length === 0) return -1;

                if (lastWasConsonant) {
                    const isSign = (idx) => (idx >= 14 && idx <= 26) || idx === 75 || idx === 77;
                    const sRows = matchingRows.filter(idx => isSign(idx));
                    if (sRows.length > 0) return sRows.find(idx => idx >= 14 && idx <= 26) || sRows[0];
                }

                const consonants = matchingRows.filter(idx => idx >= 30 && idx <= 63); // Consonants
                if (consonants.length > 0) return consonants[0];

                const indVowels = matchingRows.filter(idx => (idx >= 0 && idx <= 13) || idx === 74 || idx === 76);
                if (indVowels.length > 0) return indVowels.find(idx => idx >= 0 && idx <= 13) || indVowels[0];

                return matchingRows[0];
            };

            // ── IAST input ──
            if (fromScriptName === 'en') {
                let lastWasConsonant = false;
                while (i < text.length) {
                    const code = text.charCodeAt(i);
                    if (isVedicAccent(code)) {
                        if (toScriptName === 'ta' && result.length > 0 && /[²³⁴]$/.test(result)) {
                            const lastSup = result.slice(-1);
                            result = result.slice(0, -1) + text[i] + lastSup;
                        } else {
                            result += text[i];
                        }
                        i++;
                        continue;
                    }

                    let matched = false;
                    for (const seq of iastSeq) {
                        if (text.slice(i).startsWith(seq)) {
                            const rowIdx = findBestIastRow(seq, lastWasConsonant);
                            if (rowIdx !== -1) {
                                if (toScriptName === 'en') {
                                    result += PHONEME_TABLE[rowIdx][4];
                                } else {
                                    const isSign = (idx) => (idx >= 14 && idx <= 26) || idx === 75 || idx === 77;
                                    const isIndVowel = (idx) => (idx >= 0 && idx <= 13) || idx === 74 || idx === 76;

                                    if (isSign(rowIdx)) {
                                        result += getChar(toIdx, rowIdx, seq);
                                        lastWasConsonant = false;
                                    } else if (isIndVowel(rowIdx)) {
                                        if (lastWasConsonant && rowIdx >= 1) {
                                            let signRowIdx = rowIdx + 13;
                                            if (rowIdx === 74) signRowIdx = 75; // Short E
                                            if (rowIdx === 76) signRowIdx = 77; // Short O
                                            result += getChar(toIdx, signRowIdx, getChar(toIdx, rowIdx, seq));
                                        } else {
                                            result += getChar(toIdx, rowIdx, seq);
                                        }
                                        lastWasConsonant = false;
                                    } else {
                                        if (lastWasConsonant && rowIdx !== 28 && rowIdx !== 29) result += getChar(toIdx, 27, "");
                                        result += getChar(toIdx, rowIdx, seq);
                                        lastWasConsonant = (rowIdx >= 30 && rowIdx <= 63);
                                    }
                                }
                                i += seq.length; matched = true; break;
                            }
                        }
                    }
                    if (!matched) {
                        const ch = text[i];
                        if (ch === 'a') {
                            if (!lastWasConsonant) result += getChar(toIdx, 0, 'अ');
                            lastWasConsonant = false;
                            i++; continue;
                        }

                        const rowIdx = findBestIastRow(ch, lastWasConsonant);
                        if (rowIdx !== -1) {
                            if (toScriptName === 'en') {
                                result += PHONEME_TABLE[rowIdx][4];
                            } else {
                                if (lastWasConsonant && rowIdx !== 28 && rowIdx !== 29) result += getChar(toIdx, 27, "");
                                result += getChar(toIdx, rowIdx, ch);
                                lastWasConsonant = (rowIdx >= 30 && rowIdx <= 63);
                            }
                        } else {
                            if (lastWasConsonant) result += getChar(toIdx, 27, "");
                            result += ch;
                            lastWasConsonant = false;
                        }
                        i++;
                    }
                }
                if (lastWasConsonant && toScriptName !== 'en') result += getChar(toIdx, 27, "");
                return result;
            }

            // ── Tamil/Brahmic input ──
            const isTamil = fromScriptName === 'ta';

            while (i < text.length) {
                const code = text.charCodeAt(i);
                if (isVedicAccent(code)) {
                    if (toScriptName === 'ta' && result.length > 0 && /[²³⁴]$/.test(result)) {
                        const lastSup = result.slice(-1);
                        result = result.slice(0, -1) + text[i] + lastSup;
                    } else {
                        result += text[i];
                    }
                    i++;
                    continue;
                }

                let matched = false;

                // ── Tamil/IAST multi-tokens ──
                if (isTamil) {
                    for (const tok of tamilMultiTokens) {
                        if (text.slice(i).startsWith(tok)) {
                            const rowIdx = charToIdx[3][tok];
                            if (rowIdx !== undefined) {
                                let out = (toScriptName === 'en') ? PHONEME_TABLE[rowIdx][4] : getChar(toIdx, rowIdx, tok);
                                result += out;
                                if (toScriptName === 'en' && rowIdx >= 30 && rowIdx <= 63) {
                                    // Consonant implicit 'a'
                                    let nextTok = text.slice(i + tok.length, i + tok.length + 2);
                                    let isFollowedByVowel = false;
                                    const nextRowIdx = charToIdx[fromIdx][text[i + tok.length]];
                                    if (nextRowIdx !== undefined && ((nextRowIdx >= 14 && nextRowIdx <= 27) || nextRowIdx === 75 || nextRowIdx === 77)) isFollowedByVowel = true;

                const ch = text[i];
                const nextCh = i + 1 < text.length ? text[i + 1] : '';
                const nextNextCh = i + 2 < text.length ? text[i + 2] : '';

                // Handle Tamil superscript after vowel sign/halant/accents: e.g. த + ே + ॒ + ³ -> de॒
                if (isTamil) {
                    const rowIdx = charToIdx[fromIdx][ch];
                    const isConsonant = rowIdx >= 30 && rowIdx <= 63;
                    if (isConsonant) {
                        let j = i + 1;
                        let vowelSign = null;
                        let vowelRowIdx = null;
                        let superscript = null;
                        const accents = [];

                        while (j < text.length) {
                            const nextCode = text.charCodeAt(j);
                            const nextChar = text[j];
                            if (!superscript && /[²³⁴]/.test(nextChar)) {
                                superscript = nextChar;
                                j++;
                                continue;
                            }
                            if (isVedicAccent(nextCode)) {
                                accents.push(nextChar);
                                j++;
                                continue;
                            }
                            if (vowelSign === null && superscript === null) {
                                const nRowIdx = charToIdx[fromIdx][nextChar];
                                if (nRowIdx !== undefined && ((nRowIdx >= 14 && nRowIdx <= 27) || nRowIdx === 75 || nRowIdx === 77)) {
                                    vowelSign = nextChar;
                                    vowelRowIdx = nRowIdx;
                                    j++;
                                    continue;
                                }
                            }
                            break;
                        }

                        if (superscript) {
                            const baseChar = ch + superscript;
                            const baseRowIdx = charToIdx[fromIdx][baseChar];
                            if (baseRowIdx !== undefined) {
                                let out = (toScriptName === 'en') ? PHONEME_TABLE[baseRowIdx][4] : getChar(toIdx, baseRowIdx, baseChar);
                                result += out;
                                if (toScriptName === 'en') {
                                    if (vowelRowIdx !== null && ((vowelRowIdx >= 14 && vowelRowIdx <= 26) || vowelRowIdx === 75 || vowelRowIdx === 77)) {
                                        result += PHONEME_TABLE[vowelRowIdx][4];
                                    } else if (vowelRowIdx === null) {
                                        result += 'a';
                                    }
                                } else {
                                    if (vowelRowIdx !== null) {
                                        result += getChar(toIdx, vowelRowIdx, vowelSign);
                                    }
                                }
                                if (accents.length > 0) {
                                    result += accents.join('');
                                }
                                i = j;
                                continue;
                            }

                if (toScriptName === 'ta' && result.length > 0) {
                    const lastChar = result.slice(-1);
                    if (/[²³⁴]/.test(lastChar)) {
                        const rowIdx = charToIdx[fromIdx][ch];
                        const isVowelOrHalant = (rowIdx >= 14 && rowIdx <= 27) || rowIdx === 75 || rowIdx === 77;
                        if (isVowelOrHalant) {
                            const superscript = lastChar;
                            const outVowel = getChar(toIdx, rowIdx, ch);
                            let preSupIdx = result.length - 1;
                            while (preSupIdx > 0 && isVedicAccent(result.charCodeAt(preSupIdx - 1))) {
                                preSupIdx--;
                            }
                            const accents = result.slice(preSupIdx, -1);
                            const base = result.slice(0, preSupIdx);
                            result = base + outVowel + accents + superscript;
                            i++; continue;
                        }
                    }
                }

                const rowIdx = charToIdx[fromIdx][ch];
                if (rowIdx !== undefined) {
                    let out = (toScriptName === 'en') ? PHONEME_TABLE[rowIdx][4] : getChar(toIdx, rowIdx, ch);
                    result += out;
                    // Implicit 'a' for consonants in English output
                    if (toScriptName === 'en' && rowIdx >= 30 && rowIdx <= 63) {
                        const nextRowIdx = i + 1 < text.length ? charToIdx[fromIdx][text[i + 1]] : undefined;
                        const isSignOrHalant = nextRowIdx !== undefined && ((nextRowIdx >= 14 && nextRowIdx <= 27) || nextRowIdx === 75 || nextRowIdx === 77);
                        if (!isSignOrHalant) result += 'a';
                    }
                } else { result += ch; }
                i++;
            }
            return result;
        }

        // ── UI ──
        const scriptNames = {
            sa: 'Sanskrit (Devanagari)', ka: 'Kannada', te: 'Telugu', ta: 'Tamil', en: 'English (IAST)'
        };


        // Keep input and output scripts mutually exclusive
        function syncScriptFilters() {
            const inSel = document.getElementById('inputScript');
            const outSel = document.getElementById('outputScript');

            // Hide whichever script is chosen in input from the output dropdown
            const inVal = inSel.value;
            [...outSel.options].forEach(o => { o.hidden = o.disabled = (o.value === inVal); });
            if (outSel.value === inVal) {
                const alt = [...outSel.options].find(o => !o.disabled);
                if (alt) outSel.value = alt.value;
            }

            // Hide whichever script is now chosen in output from the input dropdown
            const outVal = outSel.value;
            [...inSel.options].forEach(o => { o.hidden = o.disabled = (o.value === outVal); });
            if (inSel.value === outVal) {
                const alt = [...inSel.options].find(o => !o.disabled);
                if (alt) inSel.value = alt.value;
            }
        }

        function onScriptChange() {
            syncScriptFilters();
            updateModeIndicator();
            if (document.getElementById('inputText').value) convertText();
        }

        function updateModeIndicator() {
            const from = document.getElementById('inputScript').value;
            const to = document.getElementById('outputScript').value;
            document.getElementById('modeIndicator').textContent =
                scriptNames[from] + ' → ' + scriptNames[to];
            document.getElementById('inputLabel').textContent = scriptNames[from] + ':';
            document.getElementById('outputLabel').textContent = scriptNames[to] + ':';
        }

        function updateExamples() {
            // Examples removed — kept for potential future use
        }

        function convertText() {
            const input = document.getElementById('inputText').value;
            const from = document.getElementById('inputScript').value;
            const to = document.getElementById('outputScript').value;
            document.getElementById('outputText').value = convertScript(input, from, to);
        }

        function onTextInput() {
            // If user types manually, clear the uploaded file state
            if (fullInputText && document.getElementById('inputText').value !== fullInputText.slice(0, 10000)) {
                fullInputText = '';
                uploadedFileName = '';
                document.getElementById('fileInfo').style.display = 'none';
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith('.txt')) {
                showModal();
                event.target.value = ''; // Reset input
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const content = e.target.result;
                fullInputText = content;
                uploadedFileName = file.name;

                const preview = content.slice(0, 10000); // Preview first 10k chars (~1-2 pages)
                document.getElementById('inputText').value = preview;

                const fileInfo = document.getElementById('fileInfo');
                fileInfo.textContent = `📄 Loaded: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                if (content.length > 10000) {
                    fileInfo.textContent += ` - Large file (Previewing first 10,000 characters)`;
                }
                fileInfo.style.display = 'inline-block';

                convertText();
            };
            reader.readAsText(file);
        }

        function downloadOutput() {
            const from = document.getElementById('inputScript').value;
            const to = document.getElementById('outputScript').value;

            let textToConvert = fullInputText || document.getElementById('inputText').value;
            if (!textToConvert) {
                alert("No text to convert and download.");
                return;
            }

            // Convert entire text
            const convertedText = convertScript(textToConvert, from, to);

            const blob = new Blob([convertedText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            const baseName = uploadedFileName ? uploadedFileName.replace(/\.[^/.]+$/, "") : "transliterated";
            a.href = url;
            a.download = `${baseName}_${to}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showModal() {
            document.getElementById('errorModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
        }

        function swapScripts() {
            const inSel = document.getElementById('inputScript');
            const outSel = document.getElementById('outputScript');
            const tmp = inSel.value; inSel.value = outSel.value; outSel.value = tmp;
            const inTxt = document.getElementById('inputText');
            const outTxt = document.getElementById('outputText');
            const tmpTxt = inTxt.value;
            inTxt.value = outTxt.value;
            outTxt.value = '';

            // Swap full text if it exists
            // This is complex because we'd need to convert the full text back? 
            fullInputText = '';
            uploadedFileName = '';
            document.getElementById('fileInfo').style.display = 'none';
            onScriptChange();
            if (inTxt.value) convertText();
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            fullInputText = '';
            uploadedFileName = '';
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('fileUpload').value = '';
        }

        function copyToClipboard() {
            document.getElementById('outputText').select();
            document.execCommand('copy');
            const n = document.getElementById('notification');
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2000);
        }

        document.getElementById('inputText').addEventListener('input', convertText);

        // Initialize state
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputScript').value = 'sa';
            document.getElementById('outputScript').value = 'en';
            syncScriptFilters();
            updateModeIndicator();
        });

        function handleBack() {
            // Try to close tab as requested
            window.close();

            // Fallback to redirect directly to homepage (bypassing apps popup state)
            setTimeout(() => {
                window.location.href = '/';
            }, 100);
        }
    </script>
