  <style>
    /* Accordion styles for story Skandas/sections */
    .accordion-item {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-card);
        overflow: hidden;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .accordion-item:hover {
        border-color: rgba(129, 140, 248, 0.25);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .accordion-header {
        width: 100%;
        text-align: left;
        padding: 16px 24px;
        background: rgba(255, 255, 255, 0.01);
        border: none;
        color: var(--text-primary);
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.2s ease, color 0.2s ease;
        outline: none;
    }
    .accordion-header:hover {
        background: var(--accent-light);
        color: var(--accent);
    }
    .accordion-item.active .accordion-header {
        background: var(--accent-light);
        color: var(--accent);
        border-bottom: 1px solid var(--border-light);
    }
    .accordion-icon {
        font-size: 0.8rem;
        transition: transform 0.3s ease;
        display: inline-block;
        color: var(--text-muted);
    }
    .accordion-item.active .accordion-icon {
        transform: rotate(90deg);
        color: var(--accent);
    }
    .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 0 24px;
    }
  </style>

  <script>
    const API_BASE = '/sdl/api/v1';
    let allStories = [];
    let currentAlbum = null;
    let currentSort = 'title';

    // ── Get Thumbnail URL ──
    function getThumbnailUrl(url) {
      if (!url) return '';
      if (url.startsWith('/katha/uploads/cov_')) {
        return url.replace('/uploads/cov_', '/uploads/thumb_cov_');
      }
      return url;
    }

    // ── Toast ──
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    // ── Format date ──
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return dateStr; }
    }

    // ── Escape HTML ──
    function escapeHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ── Truncate ──
    function truncate(s, n = 120) {
      if (!s) return '';
      const clean = s.replace(/<[^>]+>/g, '');
      return clean.length > n ? clean.substring(0, n) + '…' : clean;
    }

    // ── Deep Linking Init ──
    function initAlbumFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const album = params.get('album');
      if (album) {
        currentAlbum = album.trim();
      }
    }

    // ── Navigate to Album ──
    function selectAlbum(albumName) {
      currentAlbum = albumName;
      const url = new URL(window.location);
      url.searchParams.set('album', albumName);
      window.history.pushState({}, '', url);
      renderStories();
    }

    // ── Navigate Back to Albums List ──
    function goBackToAlbums(e) {
      if (e) e.preventDefault();
      currentAlbum = null;
      const url = new URL(window.location);
      url.searchParams.delete('album');
      window.history.pushState({}, '', url);
      renderStories();
    }

    // ── Load Stories ──
    async function loadStories() {
      const spinner = document.getElementById('loadingSpinner');
      const grid = document.getElementById('storyGrid');
      const empty = document.getElementById('emptyState');

      spinner.style.display = 'flex';
      grid.innerHTML = '';
      empty.style.display = 'none';

      try {
        // Fetch all published stories (sorting is done on backend)
        const params = new URLSearchParams();
        params.set('sort', currentSort);

        const res = await fetch(`${API_BASE}/katha/stories?${params}`);
        const data = await res.json();

        if (!data.success) throw new Error(data.error || 'Failed to load');

        allStories = data.stories;
        
        // Initial setup for current album from URL
        initAlbumFromUrl();
        
        renderStories();
      } catch (err) {
        console.error('Error loading stories:', err);
        showToast('Failed to load stories', 'error');
        empty.style.display = 'block';
      } finally {
        spinner.style.display = 'none';
      }
    }

    // ── Helper to parse hierarchical category strings (e.g. "Parent / Sub" or "Parent - Sub") ──
    function parseCategory(cat) {
      if (!cat) return { parent: 'सामान्य', sub: '' };
      let parent = cat.trim();
      let sub = '';
      if (cat.includes('/')) {
        const parts = cat.split('/');
        parent = parts[0].trim();
        sub = parts.slice(1).join('/').trim();
      } else if (cat.includes(' - ')) {
        const parts = cat.split(' - ');
        parent = parts[0].trim();
        sub = parts.slice(1).join(' - ').trim();
      }
      return { parent, sub };
    }

    // ── Group Stories into Albums ──
    function groupStoriesByAlbum(storiesList) {
      const groups = {};
      storiesList.forEach(s => {
        const { parent } = parseCategory(s.category);
        if (!groups[parent]) {
          groups[parent] = [];
        }
        groups[parent].push(s);
      });
      return groups;
    }

    // ── Render Albums (Folder Cards) Grid ──
    function renderAlbumGrid(albums) {
      const grid = document.getElementById('storyGrid');
      const empty = document.getElementById('emptyState');
      
      const albumNames = Object.keys(albums);
      if (albumNames.length === 0) {
        grid.innerHTML = '';
        document.getElementById('emptyStateTitle').textContent = 'अद्य सम्पुटाः नोपलभ्यन्ते';
        document.getElementById('emptyStateText').textContent = 'No story albums available yet. Check back later!';
        empty.style.display = 'block';
        return;
      }
      
      empty.style.display = 'none';
      grid.className = 'album-grid';
      
      let html = '';
      
      albumNames.forEach(albumName => {
        const storiesInAlbum = albums[albumName];
        const count = storiesInAlbum.length;
        
        // Pick top covers for stack randomly each time
        const shuffled = [...storiesInAlbum].sort(() => 0.5 - Math.random());
        const cover1 = shuffled[0] ? shuffled[0].cover_image_url : '';
        const cover2 = shuffled[1] ? shuffled[1].cover_image_url : '';
        const cover3 = shuffled[2] ? shuffled[2].cover_image_url : '';
        
        const renderCover = (url, index, isTop = false) => {
          if (url) {
            return `<img class="album-cover album-cover-${index}" src="${escapeHtml(getThumbnailUrl(url))}" alt="${escapeHtml(albumName)}"
                     onerror="this.outerHTML='<div class=\\'album-cover album-cover-${index} album-cover-fallback\\'>📖</div>'">`;
          } else {
            return `<div class="album-cover album-cover-${index} album-cover-fallback">${isTop ? '📖' : ''}</div>`;
          }
        };
        
        html += `
          <div class="album-card" onclick="selectAlbum('${escapeHtml(albumName)}')">
            <div class="album-stack">
              ${renderCover(cover3, 3)}
              ${renderCover(cover2, 2)}
              ${renderCover(cover1, 1, true)}
            </div>
            <div class="album-info">
              <div class="album-title">${escapeHtml(albumName)}</div>
              <div class="album-meta">📂 ${count} ${count === 1 ? 'कथा' : 'कथाः'}</div>
            </div>
          </div>
        `;
      });
      
      grid.innerHTML = html;
    }

    // ── Main Render Router ──
    function renderStories() {
      const grid = document.getElementById('storyGrid');
      const empty = document.getElementById('emptyState');
      const innerHeader = document.getElementById('albumInnerHeader');
      const filterBar = document.getElementById('filterBar');

      if (currentAlbum === null) {
        // Show Album Gallery View
        innerHeader.style.display = 'none';
        filterBar.style.display = 'none';
        
        const albums = groupStoriesByAlbum(allStories);
        renderAlbumGrid(albums);
      } else {
        // Show Stories in Album View
        innerHeader.style.display = 'flex';
        document.getElementById('currentAlbumBreadcrumb').textContent = currentAlbum;
        filterBar.style.display = 'flex'; // Show sorting dropdown within album
        grid.className = 'story-grid';

        const albumStories = allStories.filter(s => parseCategory(s.category).parent === currentAlbum);

        if (albumStories.length === 0) {
          grid.innerHTML = '';
          document.getElementById('emptyStateTitle').textContent = 'अस्मिन् सम्पुटे कथाः न सन्ति';
          document.getElementById('emptyStateText').textContent = 'No stories in this album yet.';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';

        // Group stories by their sub-category/section
        const sections = {};
        let hasSubCategories = false;
        albumStories.forEach(s => {
          const { sub } = parseCategory(s.category);
          const subName = sub || 'General';
          if (sub) hasSubCategories = true;
          if (!sections[subName]) {
            sections[subName] = [];
          }
          sections[subName].push(s);
        });

        if (hasSubCategories) {
          // Render as Accordions
          grid.className = 'accordion-container';
          grid.style.display = 'flex';
          grid.style.flexDirection = 'column';
          grid.style.gap = '16px';
          grid.style.width = '100%';

          let html = '';
          Object.keys(sections).forEach((secName, secIdx) => {
            const stories = sections[secName];
            html += `
              <div class="accordion-item active" id="accordion-${secIdx}">
                <button onclick="toggleAccordion(this)" class="accordion-header">
                  <span>📂 ${escapeHtml(secName)} (${stories.length} ${stories.length === 1 ? 'कथा' : 'कथाः'})</span>
                  <span class="accordion-icon">▶</span>
                </button>
                <div class="accordion-content">
                  <div class="story-grid" style="padding: 20px 0;">
                    ${stories.map(s => `
                      <article class="story-card" id="story-card-${s.id}" title="${escapeHtml(s.title)}" onclick="window.location.href='story.html?id=${s.id}&album=${encodeURIComponent(currentAlbum)}'">
                        <img class="story-card-cover" src="${escapeHtml(getThumbnailUrl(s.cover_image_url))}" alt="${escapeHtml(s.title)}"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22><rect fill=%22%231e1b4b%22 width=%22400%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23818cf8%22 font-size=%2240%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>📖</text></svg>'">
                        <div class="story-card-title-badge">${escapeHtml(s.title)}</div>
                      </article>
                    `).join('')}
                  </div>
                </div>
              </div>
            `;
          });
          grid.innerHTML = html;
          
          // Set max-height for active accordions to their scrollHeight so they are expanded by default
          grid.querySelectorAll('.accordion-item.active .accordion-content').forEach(content => {
            content.style.maxHeight = content.scrollHeight + 'px';
          });
        } else {
          // Render as flat list of stories directly
          grid.className = 'story-grid';
          grid.removeAttribute('style'); // Remove flex overrides
          grid.innerHTML = albumStories.map(s => `
            <article class="story-card" id="story-card-${s.id}" title="${escapeHtml(s.title)}" onclick="window.location.href='story.html?id=${s.id}&album=${encodeURIComponent(currentAlbum)}'">
              <img class="story-card-cover" src="${escapeHtml(getThumbnailUrl(s.cover_image_url))}" alt="${escapeHtml(s.title)}"
                   onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22><rect fill=%22%231e1b4b%22 width=%22400%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23818cf8%22 font-size=%2240%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22>📖</text></svg>'">
              <div class="story-card-title-badge">${escapeHtml(s.title)}</div>
            </article>
          `).join('');
        }

        // Check if we need to scroll to a specific story
        const urlParams = new URLSearchParams(window.location.search);
        const scrollToId = urlParams.get('scroll_to');
        if (scrollToId) {
          const card = document.getElementById(`story-card-${scrollToId}`);
          if (card) {
            // If it's inside an accordion, make sure the accordion is active
            const accordionItem = card.closest('.accordion-item');
            if (accordionItem && !accordionItem.classList.contains('active')) {
              accordionItem.classList.add('active');
              const content = accordionItem.querySelector('.accordion-content');
              if (content) {
                content.style.maxHeight = content.scrollHeight + 'px';
              }
            }
            
            // Wait a brief moment for layout/transitions to complete
            setTimeout(() => {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              // Highlight effect
              card.classList.add('highlighted-story');
              // Remove highlight class after some seconds
              setTimeout(() => {
                card.classList.remove('highlighted-story');
              }, 3000);
            }, 300);

            // Clean up url parameter so we don't scroll again on re-sort/re-render
            const url = new URL(window.location);
            url.searchParams.delete('scroll_to');
            window.history.replaceState({}, '', url);
          }
        }
      }
    }

    // ── Toggle Accordion for Sections ──
    window.toggleAccordion = function(header) {
      const item = header.parentElement;
      const content = item.querySelector('.accordion-content');
      
      const isActive = item.classList.toggle('active');
      if (isActive) {
        content.style.maxHeight = content.scrollHeight + 'px';
      } else {
        content.style.maxHeight = '0';
      }
    };

    // ── Sort Handler ──
    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      loadStories();
    });

    // ── Authentication & Session Sync ──
    async function syncSession() {
      const token = localStorage.getItem('user_token');
      const headers = {};
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      try {
        const res = await fetch('/sdl/api/external/session-sync', {
          method: 'POST',
          headers: headers,
          credentials: 'include'
        });
        const data = await res.json();

        if (data.logged_in) {
          localStorage.setItem('user_token', data.token);
          localStorage.setItem('user_profile', JSON.stringify(data.user));
          
          if (data.user.role === 'super' || data.user.role === 'admin') {
            sessionStorage.setItem('isKathaAdmin', 'true');
          } else {
            sessionStorage.removeItem('isKathaAdmin');
          }
        } else {
          if (token) {
            localStorage.removeItem('user_token');
            localStorage.removeItem('user_profile');
          }
          sessionStorage.removeItem('isKathaAdmin');
        }
      } catch (err) {
        console.error('Session sync failed:', err);
      } finally {
        updateNavbarAuth();
      }
    }

    function updateNavbarAuth() {
      const token = localStorage.getItem('user_token');
      const userStr = localStorage.getItem('user_profile');
      const userMenu = document.getElementById('userMenu');
      const loginLink = document.getElementById('userLoginLink');

      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          if (loginLink) loginLink.style.display = 'none';
          if (userMenu) userMenu.style.display = 'inline-flex';

          const avatarBtn = document.getElementById('userAvatarBtn');
          const avatarEmoji = document.getElementById('userAvatarEmoji');

          if (avatarBtn) {
            avatarBtn.title = `View Profile (${user.display_name || 'User'})`;
            if (user.role === 'super' || user.role === 'admin') {
              avatarBtn.href = 'admin-dashboard.html';
            } else {
              avatarBtn.href = '/user/quiz-profile';
            }
            if (user.profile_pic) {
              const picUrl = `/sdl/static/uploads/profile_pics/${user.profile_pic}`;
              avatarBtn.style.background = `url("${picUrl}") no-repeat center/cover`;
              if (avatarEmoji) avatarEmoji.textContent = '';
            } else {
              avatarBtn.style.background = user.avatar_gradient || 'linear-gradient(135deg, var(--t-accent) 0%, var(--t-accent) 100%)';
              if (avatarEmoji) avatarEmoji.textContent = user.avatar_emoji || '👤';
            }
          }
        } catch (e) {
          console.error(e);
          showGuestNavbar();
        }
      } else {
        showGuestNavbar();
      }
    }

    function showGuestNavbar() {
      const userMenu = document.getElementById('userMenu');
      const loginLink = document.getElementById('userLoginLink');
      if (userMenu) userMenu.style.display = 'none';
      if (loginLink) {
        loginLink.href = "/login?redirect=" + encodeURIComponent(window.location.pathname + window.location.search);
        loginLink.style.display = 'inline-block';
      }
    }

    function handleLogout(e) {
      if (e) e.preventDefault();
      window.location.href = '/logout?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    }

    // ── Init ──
    loadStories();
    syncSession();
  </script>
